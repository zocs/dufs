name: CI
run-name: "CI · ${{ inputs.note || github.ref_name }}"

on:
  pull_request:
    branches:
    - '*'
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      note:
        description: Purpose of this verification
        required: false
        default: ''

env:
  RUST_VERSION: '1.99.1'

defaults:
  run:
    shell: bash

jobs:
  all:
    name: All

    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest

    runs-on: ${{matrix.os}}

    env:
      RUSTFLAGS: --deny warnings

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust Toolchain Components
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@v2

    - name: Test
      run: cargo test --locked --all

    - name: Clippy
      run: cargo clippy --locked --all --all-targets

    - name: Format
      run: cargo fmt --all --check

    - name: Verify no-TLS configuration
      if: runner.os == 'Linux'
      run: |
        cargo test --locked --all --no-default-features
        cargo clippy --locked --all --all-targets --no-default-features

    - name: Install browser test runtime
      if: runner.os == 'Linux'
      uses: actions/setup-node@v6
      with:
        node-version: '22'

    - name: Verify editor in Chromium and ES2017 compatibility
      if: runner.os == 'Linux'
      run: |
        cargo build --locked --bin dufs
        npm ci --prefix tests/browser
        npm run check:es2017 --prefix tests/browser
        npm test --prefix tests/browser
